---
# vars file for php_fpm

_php_fpm_packages:
  default:
    - php-fpm
  Alpine:
    - php7-fpm
  Suse:
    - php7-fpm

php_fpm_packages: "{{ _php_fpm_packages[ansible_facts['os_family']] | default(_php_fpm_packages['default']) }}"

# Directory/service names are pinned to each release's actual default
# php-fpm package (confirmed via packages.debian.org/packages.ubuntu.com's
# "Packages providing php-fpm" listing) since the generic 'php-fpm'
# metapackage installs a different concrete version per release.
_php_fpm_directory:
  default: /etc
  Alpine: /etc/php7
  Debian: /etc/php/7.3/fpm
  Debian-testing: &testing_directory /etc/php/7.4/fpm
  Debian-11: *testing_directory
  Debian-12: /etc/php/8.2/fpm
  Debian-13: /etc/php/8.4/fpm
  Debian-unstable: /etc/php/7.4/fpm
  Fedora: /etc
  openSUSE Leap: /etc/php7/fpm
  Ubuntu-17: /etc/php/7.1/fpm
  Ubuntu-18: /etc/php/7.2/fpm
  Ubuntu-19: /etc/php/7.2/fpm
  Ubuntu-22: /etc/php/8.1/fpm
  Ubuntu-24: /etc/php/8.3/fpm
  Ubuntu-26: /etc/php/8.5/fpm
  Ubuntu: /etc/php/7.4/fpm

php_fpm_directory: "{{ _php_fpm_directory[ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version']] | default(_php_fpm_directory[ansible_facts['distribution']]
  | default(_php_fpm_directory['default'] )) }}"

_php_fpm_pid_directory:
  default: /run/php-fpm
  Alpine: /run/php-fpm7
  Debian: /run/php
  RedHat: &redhat_pid_directory /run/php-fpm
  Rocky: *redhat_pid_directory
  Suse: /var/run

php_fpm_pid_directory: "{{ _php_fpm_pid_directory[ansible_facts['os_family']] | default(_php_fpm_pid_directory['default']) }}"

_php_fpm_user:
  default: nobody
  Debian: daemon
  Suse: wwwrun

php_fpm_user: "{{ _php_fpm_user[ansible_facts['os_family']] | default(_php_fpm_user['default']) }}"

_php_fpm_include_directory:
  default: "{{ php_fpm_directory }}/php-fpm.d"
  Debian: "{{ php_fpm_directory }}/conf.d"

php_fpm_include_directory: "{{ _php_fpm_include_directory[ansible_facts['os_family']] | default(_php_fpm_include_directory['default']) }}"

_php_fpm_service:
  default: php-fpm
  Alpine: php-fpm7
  Debian-9: php7.0-fpm.service
  Debian: php7.3-fpm.service
  Debian-testing: &testing_service php7.4-fpm.service
  Debian-11: *testing_service
  Debian-12: php8.2-fpm.service
  Debian-13: php8.4-fpm.service
  Debian-unstable: php7.4-fpm.service
  Fedora: php-fpm
  openSUSE Leap: php-fpm
  Ubuntu-17: php7.1-fpm.service
  Ubuntu-18: php7.2-fpm.service
  Ubuntu-19: php7.2-fpm.service
  Ubuntu-22: php8.1-fpm.service
  Ubuntu-24: php8.3-fpm.service
  Ubuntu-26: php8.5-fpm.service
  Ubuntu: php7.4-fpm.service

php_fpm_service: "{{ _php_fpm_service[ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version']] | default(_php_fpm_service[ansible_facts['distribution']]
  | default(_php_fpm_service['default'] )) }}"

_php_fpm_owner:
  default: apache
  Debian: www-data
  Suse: wwwrun

php_fpm_owner: "{{ _php_fpm_owner[ansible_facts['os_family']] | default(_php_fpm_owner['default']) }}"

_php_fpm_group:
  default: apache
  Debian: www-data
  Suse: www

php_fpm_group: "{{ _php_fpm_group[ansible_facts['os_family']] | default(_php_fpm_group['default']) }}"
